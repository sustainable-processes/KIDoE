[project]
name = "kidoe"
version = "0.1.0"
description = "Knowledge-informed design of experiments."
authors = [
    {name = "zhangsy-ryan",email = "sz469@cam.ac.uk"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "rdflib (>=7.5.0,<8.0.0)",
    "rdkit (>=2025.9.3,<2026.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "pubchempy (>=1.0.5,<2.0.0)",
    "sympy (>=1.14.0,<2.0.0)",
    "pymoo (>=0.6.1.6,<0.7.0.0)",
    "bs4 (>=0.0.2,<0.0.3)",
    "pandas (>=3.0.1,<4.0.0)",
    "terminaltables (>=3.1.10,<4.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "lxml (>=6.0.2,<7.0.0)",
    "thermo (>=0.6.0,<0.7.0)",
    "numba (>=0.64.0,<0.65.0)",
    "pymc (==5.25.1)",
    "pyinstaller (>=6.19.0,<7.0.0)",
    "moocore (>=0.2.0,<0.3.0)"
]

[tool.poetry]
packages = [{include = "kidoe", from = ".."}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
build = "kidoe.build:install"
kidoe = "kidoe.cli:main"